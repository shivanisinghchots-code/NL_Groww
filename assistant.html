<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>SIP Break Assistant</title>
<meta name="description" content="Prototype for a Groww SIP case study: take a break from a SIP without losing it. Not investment advice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Always light, Groww's light palette. No dark mode: the app is white like Groww. */
:root {
  --green: #00B386; --green-press: #00A07A; --green-tint: #EBF9F5; --green-ink: #00866A;
  --ink: #44475B;            /* body text and card titles */
  --head: #121212;           /* screen and section headings */
  --muted: #7C7E8C;          /* secondary / meta */
  --disabled: #B0B2BB;
  --line: #E9E9EB;           /* border / divider */
  --bg: #FFFFFF;             /* page and cards */
  --surface: #F8F8F8;        /* grey surface: fields, key-value blocks, 8px section gaps */
  --page: #F1F2F4;            /* soft grey behind the phone frame */
  --line-strong: #D5D9E0;     /* button outline */
  /* type scale: change a size here and every screen follows */
  --fs-screen: 19px;   /* screen titles */
  --fs-sheet: 20px;    /* bottom-sheet titles */
  --fs-section: 16px;  /* section headings */
  --fs-card: 16px;     /* card / row titles */
  --fs-body: 15px;     /* body text, assistant reply, user bubble */
  --fs-btn: 15px;      /* buttons */
  --fs-chip: 14px;     /* chips */
  --fs-meta: 13px;     /* captions, helpers, disclaimers - never smaller */
  --fs-tab: 12px;      /* bottom tab bar labels */
  --red: #EB5B3C; --red-tint: #FDF0ED;
  --amber: #F5A623; --amber-tint: #FFF6E5; --amber-ink: #8A5300;   /* -ink shades: readable text on the tints */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { background: linear-gradient(160deg, #f5f7fa, #e9edf2) fixed; color: var(--ink); font: 400 var(--fs-body)/1.5 var(--font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
a { color: var(--green-ink); }

/* ---------- type scale: the only sizes used anywhere
   screen title 18/600 head · section 16/600 head · card title 15/600 ink
   body 14/400 ink · meta 12/400 muted · numbers 16-20/600 tabular */
.t-screen { font-size: var(--fs-screen); font-weight: 600; color: var(--head); }
.sec-h { font-size: var(--fs-section); font-weight: 600; color: var(--head); margin: 0; }
.sec-sub { font-size: var(--fs-meta); color: var(--muted); margin: 0; }
.lbl { font-size: var(--fs-meta); font-weight: 400; color: var(--muted); }
.num, .hero-num, .kvblock b, .siprow .amt b { font-variant-numeric: tabular-nums; }
.num { font-size: 16px; font-weight: 600; color: var(--head); }
.hero-num { font-size: 20px; font-weight: 600; color: var(--head); line-height: 1.2; }
.small { font-size: var(--fs-meta); color: var(--muted); }

/* ---------- desktop: phone frame centred; phones: full screen */
.stage { min-height: 100%; display: grid; place-items: center; padding: 24px 16px 16px; gap: 14px; }
/* --k is set by fitPhone() so a short window scales the whole device down instead of clipping it */
.phonebox { width: calc(417px * var(--k, 1)); height: calc(876px * var(--k, 1)); }
.phone { position: relative; width: 417px; height: 876px; padding: 12px; border-radius: 67px;
  background: linear-gradient(145deg, #2b2b2e, #1a1a1c 40%, #3a3a3d);
  box-shadow: inset 0 0 0 1.5px #4a4a4e, 0 0 0 1px #0d0d0e, 0 30px 60px rgba(0,0,0,.25), 0 10px 20px rgba(0,0,0,.15);
  transform: scale(var(--k, 1)); transform-origin: top left; }
.side { position: absolute; width: 4px; background: #2a2a2d; border-radius: 2px; }
.side.action { left: -3px; top: 120px; height: 32px; }
.side.volup  { left: -3px; top: 180px; height: 60px; }
.side.voldn  { left: -3px; top: 255px; height: 60px; }
.side.power  { right: -3px; top: 200px; height: 95px; }
.device { position: relative; width: 393px; height: 852px; border-radius: 55px; overflow: hidden; background: var(--bg); display: flex; flex-direction: column; --homebar: 22px; }
.island { position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 125px; height: 37px; border-radius: 20px; background: #000; z-index: 25; pointer-events: none; }
.homebar { position: absolute; left: 50%; transform: translateX(-50%); bottom: 8px; width: 134px; height: 5px; border-radius: 3px; background: #000; z-index: 24; pointer-events: none; }
.statusbar { flex: none; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; background: var(--bg); font-size: 17px; font-weight: 600; color: var(--head); font-variant-numeric: tabular-nums; }
.sb-ic { display: inline-flex; gap: 5px; align-items: center; color: var(--head); }
.caption { font-size: var(--fs-meta); line-height: 1.5; color: var(--muted); text-align: center; max-width: 420px; }
.caption button { background: none; border: 0; padding: 2px; color: var(--green-ink); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 500px) {
  .stage { padding: 0; display: block; }
  .phonebox { width: 100%; height: 100dvh; }
  .phone { width: 100%; height: 100dvh; padding: 0; border-radius: 0; background: none; box-shadow: none; transform: none; }
  .device { width: 100%; height: 100dvh; border-radius: 0; --homebar: 0px; }
  .caption, .statusbar, .island, .side, .homebar { display: none; }
}

/* ---------- app chrome */
.top { display: flex; align-items: center; gap: 8px; padding: 8px 16px; padding-top: max(8px, env(safe-area-inset-top)); background: var(--bg); border-bottom: 1px solid transparent; flex: none; min-height: 56px; }
.top.line { border-bottom-color: var(--line); }
.top h1 { margin: 0; font-size: var(--fs-screen); font-weight: 600; color: var(--head); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; display: grid; place-items: center; flex: none; color: var(--head); }
.top > .iconbtn:first-child { margin-left: -10px; }
.iconbtn:hover { background: var(--surface); }
.brand { height: 22px; width: auto; display: block; flex: none; }
.grow { flex: 1; }
.demo-btn { font-size: var(--fs-meta); font-weight: 600; border: 1px solid var(--line); background: var(--bg); padding: 0 10px; min-height: 40px; border-radius: 99px; display: inline-flex; gap: 5px; align-items: center; color: var(--ink); flex: none; }
.demo-btn:hover { border-color: var(--green); }
.view { flex: 1; overflow-y: auto; overscroll-behavior: contain; background: var(--bg); }
.pad { padding: 14px 16px; display: grid; gap: 12px; align-content: start; }
.sec { padding: 16px; display: grid; gap: 12px; align-content: start; }
.gap { height: 8px; background: var(--surface); flex: none; }               /* Groww's 8px grey section gap */
.stack { display: grid; gap: 6px; }                                        /* 8px between related items */
.tabs { display: flex; gap: 24px; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; background: var(--bg); overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs span { padding: 12px 0; font-size: var(--fs-body); font-weight: 500; color: var(--muted); white-space: nowrap; border-bottom: 2px solid transparent; }
.tabs span.on { color: var(--head); font-weight: 600; border-bottom-color: var(--green); }
.nav { display: flex; border-top: 1px solid var(--line); background: var(--bg); padding-bottom: calc(env(safe-area-inset-bottom) + var(--homebar, 0px)); flex: none; }
.nav span { flex: 1; display: grid; justify-items: center; gap: 3px; padding: 9px 0; min-height: 48px; font-size: var(--fs-tab); color: var(--muted); font-weight: 500; }
.nav span.on { color: var(--green-ink); font-weight: 600; }
.nav svg { width: 22px; height: 22px; }

/* ---------- SIP list */
.summary { display: grid; gap: 2px; }
.card { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.siprow { display: flex; gap: 12px; align-items: center; width: 100%; min-height: 72px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.siprow:hover { border-color: var(--green); }
.fundicon { width: 40px; height: 40px; border-radius: 8px; background: var(--green-tint); color: var(--green-ink); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }
.siprow .mid { flex: 1; min-width: 0; display: grid; gap: 2px; }
.siprow .name { font-size: var(--fs-card); font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.siprow .amt { text-align: right; display: grid; gap: 2px; flex: none; }
.siprow .amt b { font-size: 16px; font-weight: 600; color: var(--head); }
.siprow .chev { color: var(--disabled); flex: none; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-meta); font-weight: 600; color: var(--green-ink); }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.status.warn { color: var(--amber-ink); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs-meta); font-weight: 600; padding: 5px 10px; border-radius: 99px; background: var(--green-tint); color: var(--green-ink); }
.pill.warn { background: var(--amber-tint); color: var(--amber-ink); }
.hint { font-size: var(--fs-meta); color: var(--muted); background: var(--surface); border-radius: 12px; padding: 12px; display: flex; gap: 8px; align-items: flex-start; }
.hint b { color: var(--ink); font-weight: 600; }

/* ---------- SIP details */
.fundhead { display: flex; gap: 12px; align-items: center; }
.fundhead h2 { margin: 0; font-size: var(--fs-section); font-weight: 600; color: var(--head); line-height: 1.35; }
.fundhead div { min-width: 0; display: grid; gap: 2px; }
.hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hero .amt { display: grid; gap: 2px; }
.kvblock { background: var(--surface); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
.kvblock > div { display: grid; gap: 2px; min-width: 0; }
.kvblock b { font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
.actionlist { display: grid; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--bg); }
.actionlist button { display: flex; align-items: center; gap: 12px; padding: 12px; min-height: 56px; background: transparent; border: 0; text-align: left; width: 100%; }
.actionlist button + button { border-top: 1px solid var(--line); }
.actionlist button:hover { background: var(--surface); }
.actionlist .ic { width: 36px; height: 36px; border-radius: 50%; background: var(--green-tint); color: var(--green-ink); display: grid; place-items: center; flex: none; }
.actionlist .t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.actionlist .t b { font-size: var(--fs-card); font-weight: 600; color: var(--ink); }
.actionlist .chev { color: var(--disabled); flex: none; }
.actionlist .danger b { color: var(--red); }
.actionlist .danger .ic { background: var(--red-tint); color: var(--red); }

/* ---------- bottom sheet */
.scrim { position: absolute; inset: 0; background: rgba(16,18,27,.45); z-index: 20; opacity: 0; transition: opacity .28s ease; }
.scrim.show { opacity: 1; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 20px 20px 0 0; max-height: 92%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .34s cubic-bezier(.22,.9,.3,1); box-shadow: 0 -10px 30px -12px rgba(16,18,27,.22); }
.sheet.show { transform: none; }
@media (prefers-reduced-motion: reduce) { .sheet, .scrim { transition: none; } }
.grab { width: 36px; height: 4px; border-radius: 4px; background: var(--line); margin: 8px auto 4px; flex: none; }
.sheet-h { display: flex; align-items: flex-start; gap: 8px; padding: 4px 16px 0; flex: none; }
.sheet-h h3 { margin: 0; font-size: var(--fs-sheet); font-weight: 600; color: var(--head); flex: 1; min-width: 0; line-height: 1.35; }
.sheet-h .iconbtn { margin: -8px -10px 0 0; }
.sheet-b { overflow-y: auto; padding: 12px 16px 16px; display: grid; gap: 12px; align-content: start; }
.sheet-f { padding: 12px 16px; padding-bottom: calc(max(12px, env(safe-area-inset-bottom)) + var(--homebar, 0px)); border-top: 1px solid var(--line); background: var(--bg); display: grid; gap: 8px; flex: none; }
/* sticky action bar + fade that appears only while there is more to scroll */
.actionbar { box-shadow: 0 -4px 12px rgba(0,0,0,.06); z-index: 6; gap: 8px; }
.btnrow { display: flex; gap: 12px; }
.actionbar .btn-keep, .actionbar .btn-second { flex: 1; min-width: 0; width: auto; height: 48px; min-height: 48px; border-radius: 12px;
  padding: 0 8px; font-size: var(--fs-btn); white-space: nowrap; overflow: hidden; }
.actionbar .btn-second { background: var(--bg); border: 1.5px solid var(--line-strong); color: var(--ink); font-weight: 500; }
.actionbar .btn-second:hover { border-color: var(--green); }
.actionbar .btn-second:disabled { background: var(--bg); border-color: var(--line); color: var(--disabled); }
.actionbar .btn-keep { background: var(--green); color: #fff; border: 1.5px solid var(--green); font-weight: 600; }  /* matching border keeps both halves exactly equal */
.actionbar .btn-keep:hover { background: var(--green-press); }
.scrollwrap { position: relative; flex: 1; min-height: 0; display: flex; }
.scrollwrap > .view { flex: 1; }
.scrollfade { position: absolute; left: 0; right: 0; bottom: 0; height: 36px; pointer-events: none; opacity: 0; transition: opacity .2s;
  background: linear-gradient(to top, var(--bg), rgba(255,255,255,0)); }
.scrollfade.show { opacity: 1; }
.ai-tag { display: inline-flex; align-items: center; gap: 5px; font-size: var(--fs-meta); font-weight: 600; color: var(--green-ink); background: var(--green-tint); padding: 4px 9px; border-radius: 99px; justify-self: start; }
.sheet-ttl { flex: 1; min-width: 0; display: grid; gap: 4px; }   /* ai-tag · title · one-line helper */
.sheet-ttl .ai-tag { margin-bottom: 4px; }
.helper { margin: 0; font-size: var(--fs-meta); color: var(--muted); }

/* ---------- form controls */
textarea { width: 100%; min-height: 82px; max-height: 120px; resize: none; font: 400 var(--fs-body)/1.5 var(--font); color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
textarea::placeholder { color: var(--disabled); }
textarea:focus { border-color: var(--green); outline: none; }
.counter { font-size: var(--fs-meta); color: var(--muted); text-align: right; margin-top: -8px; }
.counter.over { color: var(--red); }
.fieldlbl { font-size: var(--fs-section); font-weight: 600; color: var(--ink); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 2px 16px; }
.chips::-webkit-scrollbar { display: none; }
.chips .chip { flex: none; }
.chip { font-size: var(--fs-chip); font-weight: 500; min-height: 40px; padding: 8px 14px; border-radius: 99px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); white-space: nowrap; }
.chip:hover { border-color: var(--green); }
.chip[aria-pressed="true"] { background: var(--green-tint); border-color: var(--green); color: var(--green-ink); font-weight: 600; }
.btn { border: 0; border-radius: 12px; padding: 0 16px; min-height: 48px; font-weight: 600; font-size: var(--fs-btn); width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.primary { background: var(--green); color: #fff; }
.btn.primary:hover { background: var(--green-press); }
.btn.outline { background: var(--bg); border: 1px solid var(--line); color: var(--ink); }
.btn.outline:hover { border-color: var(--green); }
.btn.danger { background: var(--bg); border: 1px solid var(--red); color: var(--red); }
.btn.link { background: none; color: var(--green-ink); min-height: 44px; font-size: var(--fs-btn); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
.btn:disabled { background: var(--bg); border: 1px solid var(--line); color: var(--disabled); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; justify-self: start; }
.seg button { border: 0; background: var(--bg); padding: 0 16px; min-height: 44px; font-size: var(--fs-btn); font-weight: 500; color: var(--ink); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--green); color: #fff; font-weight: 600; }
.ctl { display: grid; gap: 8px; }
.ctl label, .ctl .l { font-size: var(--fs-body); font-weight: 600; color: var(--ink); }
input[type=range] { width: 100%; accent-color: var(--green); min-height: 40px; }
input[type=number] { font: 400 var(--fs-body) var(--font); padding: 0 12px; min-height: 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); width: 140px; }
input[type=number]:focus { border-color: var(--green); outline: none; }
.toggle { display: flex; gap: 10px; align-items: center; min-height: 40px; font-size: var(--fs-body); color: var(--ink); }
.toggle input { width: 18px; height: 18px; accent-color: var(--green); flex: none; }

/* ---------- the reply, the notes, the options */
.aicard { border-radius: 14px; padding: 10px 12px; background: var(--green-tint); display: grid; gap: 4px; }
.aicard .head { display: flex; align-items: center; gap: 8px; }
.aicard .head b { flex: 1; min-width: 0; font-size: var(--fs-meta); font-weight: 600; color: var(--green-ink); }
.spark { width: 24px; height: 24px; border-radius: 50%; background: var(--green); display: grid; place-items: center; flex: none; }
.aicard p { margin: 0; font-size: var(--fs-body); line-height: 1.5; color: var(--ink); }
.replyfoot { margin: 0; font-size: var(--fs-meta); line-height: 1.5; color: var(--muted); }
.aicard .clarify { font-size: var(--fs-body); color: var(--muted); }
.you { justify-self: end; max-width: 85%; background: var(--surface); border-radius: 12px 12px 2px 12px; padding: 10px 12px; font-size: var(--fs-body); color: var(--ink); overflow-wrap: anywhere; }
.banner { background: var(--amber-tint); border-radius: 12px; padding: 12px; display: grid; grid-template-columns: 18px 1fr; gap: 4px 10px; font-size: var(--fs-body); color: var(--ink); }
.banner .ic { color: var(--amber-ink); margin-top: 2px; }
.banner .txt b { display: block; font-weight: 600; color: var(--head); }
.banner .rulerow { grid-column: 2; }
.inforow { background: var(--surface); border-radius: 12px; padding: 8px 10px; display: grid; grid-template-columns: 16px 1fr; gap: 4px 8px; align-items: start; font-size: var(--fs-meta); color: var(--muted); }
.inforow .ic { color: var(--muted); margin-top: 2px; }
.inforow .rulerow { grid-column: 2; margin: 0; }
.opthead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.optlist { display: grid; gap: 10px; }
.opt { border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; background: var(--bg); }
.opt h4 { margin: 0; font-size: var(--fs-card); font-weight: 600; color: var(--ink); line-height: 1.4; }
.opt p { margin: 0; font-size: var(--fs-body); line-height: 1.5; color: var(--ink); }
.opt p.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.opt .rem { font-size: var(--fs-meta); color: var(--muted); }
.opt .rem b { font-weight: 600; color: var(--ink); }
.opt .tag { font-size: var(--fs-meta); font-weight: 600; color: var(--green-ink); }
.opt .tag.no { color: var(--amber-ink); }
.opt.hero { border: 1.5px solid var(--green); background: #FDFFFE; padding: 13px; }
.opt.hero h4 { font-size: var(--fs-card); color: var(--head); }
.opt.blocked { background: var(--surface); }
.opt.blocked h4, .opt.blocked p { color: var(--muted); }
.opt .foot { display: flex; justify-content: flex-end; gap: 8px; align-items: center; flex-wrap: wrap; }
.opt .foot button { min-height: 40px; border-radius: 10px; padding: 0 16px; font-size: var(--fs-btn); font-weight: 600; border: 1px solid var(--green); color: var(--green-ink); background: var(--bg); }
.opt .foot button:hover { background: var(--green-tint); }
.opt.hero .foot .choose { flex: 1; background: var(--green); color: #fff; border-color: var(--green); min-height: 44px; }
.opt.hero .foot .choose:hover { background: var(--green-press); }
.opt .foot button:disabled { border-color: var(--line); color: var(--disabled); background: var(--bg); }
/* rule citations: de-emphasised 11px grey text at the bottom of a card, never competing with the button */
.rulerow { display: flex; flex-wrap: wrap; gap: 0 6px; align-items: center; font-size: var(--fs-meta); color: var(--muted); margin: -8px 0 -10px; }
.inforow .rulerow, .banner .rulerow { margin: 0; }
.rule { font-size: var(--fs-meta); font-weight: 600; border: 0; background: none; padding: 0 2px; min-height: 40px; display: inline-flex; align-items: center; color: var(--muted); text-decoration: underline; text-underline-offset: 2px; }
.rule:hover, .rule[aria-expanded="true"] { color: var(--green-ink); }
.rulesep { color: var(--disabled); }
/* identical in option cards and in notes; the 1px line keeps it visible on the grey note background too */
.rulebox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 6px; }
.rulebox b { font-size: var(--fs-body); font-weight: 600; color: var(--ink); line-height: 1.4; }
.rulebox q { font-style: normal; font-size: var(--fs-body); color: var(--muted); line-height: 1.5; }
.rulebox a { font-size: var(--fs-btn); font-weight: 600; justify-self: start; display: inline-flex; align-items: center; min-height: 40px; }
.inforow .rulebox, .banner .rulebox { grid-column: 1 / -1; }   /* own line, full width of the note */
.opt .rulebox { margin-top: 14px; }   /* clears .rulerow's negative bottom margin so the box never rides up onto the rule text */
.eyebrow { font-size: var(--fs-section); font-weight: 600; color: var(--head); }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: b 1s infinite ease-in-out; }
.typing i:nth-child(2) { animation-delay: .15s } .typing i:nth-child(3) { animation-delay: .3s }
@keyframes b { 0%, 80%, 100% { opacity: .25; transform: translateY(0) } 40% { opacity: 1; transform: translateY(-3px) } }

/* ---------- safety check sheet */
.verdict { border-radius: 12px; padding: 12px; font-size: var(--fs-body); font-weight: 600; background: var(--green-tint); color: var(--green-ink); }
.verdict.no { background: var(--amber-tint); color: var(--amber-ink); }
.verdict.na { background: var(--surface); color: var(--muted); }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.checklist li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; font-size: var(--fs-body); color: var(--ink); }
.checklist .i { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 600; background: var(--green-tint); color: var(--green-ink); }
.checklist .no .i { background: var(--red-tint); color: var(--red); }
.checklist small { display: block; font-size: var(--fs-meta); color: var(--muted); overflow-wrap: anywhere; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 8px 14px; margin: 0; background: var(--surface); border-radius: 12px; padding: 12px; }
.kv dt { font-size: var(--fs-meta); color: var(--muted); }
.kv dd { margin: 0; font-size: var(--fs-body); color: var(--ink); overflow-wrap: anywhere; }
.blocked-reply { font-size: var(--fs-body); color: var(--muted); text-decoration: line-through; text-decoration-color: var(--red); }

/* ---------- demo sheet */
.caselist { display: grid; gap: 8px; }
.case { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 12px; padding: 10px 12px; min-height: 40px; display: grid; gap: 2px; }
.case:hover { border-color: var(--green); }
.case b { font-size: var(--fs-meta); font-weight: 600; color: var(--green-ink); }
.case span { font-size: var(--fs-body); color: var(--ink); overflow-wrap: anywhere; }

/* ---------- done screen */
.done { display: grid; justify-items: center; text-align: center; gap: 12px; padding: 48px 16px 24px; }
.done .tick { width: 64px; height: 64px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; }
.done h2 { margin: 0; font-size: var(--fs-screen); font-weight: 600; color: var(--head); }
.done p { margin: 0; font-size: var(--fs-body); color: var(--muted); max-width: 300px; }
.done .btn { max-width: 280px; }
.toast { position: absolute; left: 16px; right: 16px; top: 70px; z-index: 30; background: var(--head); color: #fff; border-radius: 8px; padding: 11px 14px; font-size: 13px; opacity: 0; transform: translateY(-8px); transition: .2s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
</style>
</head>

          <svg width="18" height="13" viewBox="0 0 16 12" fill="currentColor"><path d="M8 11.2 6.1 9.2a2.7 2.7 0 0 1 3.8 0zM3.4 6.5a6.8 6.8 0 0 1 9.2 0l-1.3 1.4a4.9 4.9 0 0 0-6.6 0zM.6 3.6a10.9 10.9 0 0 1 14.8 0L14.1 5a9 9 0 0 0-12.2 0z"/></svg>
          <svg width="29" height="14" viewBox="0 0 25 12" fill="none"><rect x=".6" y=".6" width="21" height="10.8" rx="3.2" stroke="currentColor" stroke-opacity=".4" stroke-width="1.1"/><rect x="2.2" y="2.2" width="15" height="7.6" rx="2" fill="currentColor"/><path d="M23.2 4.2v3.6a2 2 0 0 0 0-3.6z" fill="currentColor" fill-opacity=".45"/></svg>

<script>
/* Break Assistant core, shared by the page (inlined at build time), the Vercel function (api/break.js)
   and the eval runner (evals/run.js).

   Split of work:
   - The AI understands the person's own words (English, Hindi, Hinglish): what they want, for how long,
     and writes a short reply in their language.
   - This file owns every fact: the official Groww Help Centre rules (quoted word for word), the plan of
     options and their consequences, and the gate that checks each AI reply before anyone sees it. */
(function (root, factory) {
  if (typeof module === "object" && module.exports) module.exports = factory();
  else root.BreakCore = factory();
})(typeof self !== "undefined" ? self : this, function () {
  const HELP = "https://groww.in/help/mutual-funds/mf_sip/";

  // Official rules, quoted from Groww Help Centre articles collected on 29 Oct 2026.
  const RULES = {
    R1: { title: "One skip at a time", url: HELP + "what-is-the-maximum-period-for-which-i-can-skip-my-sip-installments--63",
      quote: "Currently, you can skip only one SIP installment at a time. After skipping one, you can request to skip another installment for the same SIP once the first skipped installment date has passed." },
    R2: { title: "Three in a row cancels the SIP", url: HELP + "how-to-skip-an-sip-instalment--79",
      quote: "Your SIP will be automatically cancelled if you skip or miss 3 installments in a row." },
    R3: { title: "Skips need 2 days' notice", url: HELP + "what-is-the-maximum-period-for-which-i-can-skip-my-sip-installments--63",
      quote: "If your next installment is due within two days, your skip request will not apply to that installment but will apply to the ones after." },
    R4: { title: "A cancel can't be undone", url: HELP + "how-to-cancel-my-sip",
      quote: "Once you place the request to cancel the SIP, it cannot be undone." },
    R5: { title: "No cancelling within 7 days of a payment", url: HELP + "how-to-cancel-my-sip",
      quote: "You cannot cancel your SIP if the next installment is due within the next 7 days. The installment must be paid before you can cancel it." },
    R6: { title: "Money already invested stays invested", url: HELP + "how-to-cancel-my-sip",
      quote: "Canceling the SIP will stop future installments, but your invested amount will remain as is until you redeem it." },
    R7: { title: "You can start again later", url: HELP + "how-to-cancel-my-sip",
      quote: "You can create a new SIP in the same fund, and the amount will be added to the investment." },
    R8: { title: "Change the amount or date", url: HELP + "how-to-change-sip-date-or-amount",
      quote: "Click 'Change Amount/Date'. Update the amount or date as needed, then click 'Save Changes'. Note: If your next instalment is within 2 working days, changes will apply only to future instalments." },
    R9: { title: "30 days between instalments", url: HELP + "why-is-my-sip-installment-skipping-the-1st-month",
      quote: "There has to be a mandatory 30-day gap between payments of SIP installments." },
    R10: { title: "No penalty for a failed AutoPay", url: "https://groww.in/help/mutual-funds/mf_autopay/will-there-be-any-penalty-charges-if-my-sip-payment-via-upi-autopay-fails-due-to-insufficient-balance--22",
      quote: "No, there are no penalty charges if your SIP payment via UPI AutoPay fails because of insufficient balance in your bank account." },
    R11: { title: "Pay a missed instalment for 2 working days", url: HELP + "how-do-i-pay-for-a-missed-installment-3",
      quote: "If your SIP failed due to insufficient balance, you'll see a 'Pay Now' option on the dashboard to pay the missed SIP. This option will be available for 2 working days." },
    R12: { title: "Paying late counts as failed", url: HELP + "what-happens-if-i-pay-after-date-shown-on-pending-sip--42",
      quote: "If you pay after the date shown for your pending SIP, the installment is automatically considered failed." },
    R13: { title: "AutoPay approval takes time", url: HELP + "how-do-monthly-installments-get-paid-automatically",
      quote: "Note: It may take 2-7 working days for the bank to approve AutoPay." },
  };
  const RULE_NUMBERS = ["1", "2", "3", "7", "30"]; // numbers that appear in the rules above (2-7 days, 3 in a row, 30-day gap)

  const INTENTS = ["cash_need_break", "stop_permanently", "change_date", "change_amount", "market_or_returns_worry",
                   "fund_advice", "payment_problem", "other_question", "unclear"];
  const LANGS = ["en", "hinglish", "hi"];

  // ---------- input hygiene
  const PII = [
    [/\b[A-Z]{5}\d{4}[A-Z]\b/gi, "[PAN removed]"],
    [/[\w.+-]+@[\w-]+\.[\w.]+/g, "[email removed]"],
    [/\b[\w.-]+@(ok\w+|ybl|paytm|upi|axl|ibl|apl)\b/gi, "[UPI ID removed]"],
    [/(?<!\d)(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}(?!\d)/g, "[phone removed]"],
    [/(?<!\d)\d{11,18}(?!\d)/g, "[account number removed]"],
    [/(?<!\d)\d{4}[\s-]\d{4}[\s-]\d{4}(?!\d)/g, "[Aadhaar removed]"],
  ];
  function redact(text) {
    let out = String(text || ""), found = [];
    for (const [re, tag] of PII) { if (re.test(out)) found.push(tag.replace(/\[| removed\]/g, "")); re.lastIndex = 0; out = out.replace(re, tag); }
    return { text: out, removed: found };
  }
  const HINGLISH = /\b(hai|nahi|nhi|kya|kar|karna|karu|mera|meri|mujhe|paisa|paise|mahine|mahina|kaise|kyu|bhai|lekin|aur|toh|ho|gaya|raha|chahiye|band|ruk|abhi|bhar|paunga|sakta|sakti|wala|ke liye|kitna)\b/gi;
  function detectLang(text) {
    if (/[ऀ-ॿ]/.test(text)) return "hi";
    return (String(text).match(HINGLISH) || []).length >= 2 ? "hinglish" : "en";
  }

  // ---------- state helpers
  function normState(s = {}) {
    const int = (v, d) => { const n = parseInt(v, 10); return Number.isFinite(n) ? n : d; };   // 0 is a real value, not "missing"
    const consecutive = Math.min(2, Math.max(0, int(s.consecutive, 0)));
    const daysToNext = Math.min(31, Math.max(0, int(s.daysToNext, 15)));
    const amount = Math.min(10000000, Math.max(100, int(s.amount, 3000)));
    return { consecutive, daysToNext, amount };
  }
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function addMonths(d, n) {   // 31 Jan + 1 month = 28/29 Feb, not 3 Mar
    const x = new Date(d), day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + n);
    x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; }
  const fmtDate = d => `${d.getDate()} ${MONTHS.at(d.getMonth())} ${d.getFullYear()}`;

  // ---------- the plan: options + consequences, decided by code from the rules
  function plan({ action, intent, months, state, today }) {
    const st = normState(state), now = today ? new Date(today) : new Date();
    const next = addDays(now, st.daysToNext);
    const safeSkips = 2 - st.consecutive;                 // a 3rd consecutive skip or miss cancels the SIP (R2)
    const skipWindowClosed = st.daysToNext <= 2;          // R3, R8
    const cancelBlocked = st.daysToNext <= 7;             // R5
    const m = Number.isInteger(months) && months > 0 ? Math.min(months, 24) : null;
    const notes = [], options = [];
    const dueIn = st.daysToNext === 0 ? "today" : st.daysToNext === 1 ? "tomorrow" : `in ${st.daysToNext} days`;
    const add = o => options.push(o);

    if (skipWindowClosed && ["change_date", "change_amount"].includes(intent))
      notes.push({ kind: "warn", text: `Your next instalment is due ${dueIn}, so a change now applies only from the instalment after it.`, rules: ["R8"] });
    if (["cash_need_break", "payment_problem"].includes(intent) || (action === "skip" && intent === "unclear"))
      notes.push({ kind: "info", text: "If a payment simply fails for low balance, there is no penalty, but it still counts towards the 3 in a row.", rules: ["R10", "R2"] });
    if (st.consecutive > 0)
      notes.push({ kind: st.consecutive >= 2 ? "warn" : "info", text: `This SIP has ${st.consecutive} skipped or missed instalment${st.consecutive === 1 ? "" : "s"} in a row already.` +
        (st.consecutive >= 2 ? " One more skip or missed instalment would cancel the SIP automatically." : ""), rules: ["R2"] });

    if (intent === "cash_need_break" || (action === "skip" && ["unclear", "other_question"].includes(intent))) {
      const want = m ?? 1;
      if (m === null) notes.push({ kind: "ask", text: "How long do you need a break for? Choose below and the options will update.", rules: [] });
      // An instalment due within 2 days can't be skipped (R3). Paying it resets the in-a-row count;
      // if it fails, it counts as a miss towards the 3 (R2). Plan on paying it, and say what happens if not.
      const dueSoon = `the instalment due ${dueIn}`;
      const effSafe = skipWindowClosed ? 2 : safeSkips;
      const inRow = skipWindowClosed ? want : st.consecutive + want;   // paying the due one resets the count
      if (skipWindowClosed)
        notes.push({ kind: "warn", text: `${dueSoon[0].toUpperCase() + dueSoon.slice(1)} can't be skipped any more. Paying it keeps the in-a-row count at zero; if it fails, it counts as 1 missed${st.consecutive + 1 >= 3 ? " and would cancel the SIP" : ""}.`, rules: ["R3", "R2"] });
      if (want <= effSafe) {
        const back = addMonths(next, want + (skipWindowClosed ? 1 : 0));
        const firstSkipped = skipWindowClosed ? addMonths(next, 1) : next;   // the instalment due now can't be skipped (R3)
        add({ id: "skip", primary: true,
          title: skipWindowClosed
            ? "Pay the one due now, then skip the next one" + (want > 1 ? ", one request at a time" : "")
            : want === 1 ? "Skip the next instalment" : `Skip ${want} months, one request at a time`,
          body: want > 1
            ? `Groww lets you skip one instalment at a time. Skip the next one now (due ${fmtDate(firstSkipped)}); once that date has passed, request the next skip. Your SIP stays active and restarts on its own around ${fmtDate(back)}.`
            : `Request one skip at a time; ask for the next one after the first skipped date passes. Your SIP stays active and restarts on its own around ${fmtDate(back)}.`,
          rules: skipWindowClosed ? ["R3", "R1", "R2"] : ["R1", "R2"], reminder: fmtDate(addDays(back, -3)),
          firstSkipDate: fmtDate(firstSkipped),
          ...(want > 1 ? { nextSkipReminder: fmtDate(addDays(firstSkipped, 1)) } : {}) });
        add({ id: "lower", title: "Or lower the amount instead", body: "Keep investing a smaller amount during the break; change it back later. The minimum depends on the fund and is shown in the app.", rules: ["R8"] });
      } else {
        add({ id: "skip_partial", primary: true,
          title: skipWindowClosed ? "Pay the one due now, skip one at a time, then pay one"
               : effSafe === 2 ? "Skip one now and one next month, then pay one"
               : effSafe === 1 ? "Skip one now, then pay the next one"
               : "Pay the next instalment, then skip",
          body: `This break would make ${inRow} skipped or missed in a row${!skipWindowClosed && st.consecutive ? ` (counting the ${st.consecutive} already missed)` : ""}, and 3 in a row cancels the SIP automatically. Paying one instalment in between (even at a lower amount) keeps it active.`,
          rules: ["R2", "R1", "R8"], warn: true,
          firstSkipDate: fmtDate(skipWindowClosed || effSafe === 0 ? addMonths(next, 1) : next) });
        add({ id: "lower", title: "Lower the amount for the break", body: "Keep the SIP running at a smaller amount you can manage, then raise it again when things settle. The minimum depends on the fund and is shown in the app.", rules: ["R8"] });
        add({ id: "cancel_restart", title: "Cancel now and start a new SIP later", body: "Your invested money stays invested. A cancel can't be undone, but you can start a new SIP in the same fund later.", rules: ["R4", "R6", "R7"] });
      }
    }

    if (intent === "change_date")
      add({ id: "date", primary: true, title: "Move the date to after payday", body: "Pick a date a few days after your salary arrives. Instalments need a 30-day gap, so check the next debit date the app shows before you confirm.", rules: ["R8", "R9"] });
    if (intent === "change_amount")
      add({ id: "amount", primary: true, title: "Change the amount", body: "Set a new monthly amount; you can change it again later. The minimum depends on the fund and is shown in the app.", rules: ["R8"] });
    if (intent === "payment_problem") {
      add({ id: "paynow", primary: true, title: "Pay the missed instalment", body: "A 'Pay Now' option appears on the dashboard for 2 working days. Paying after the date shown counts as failed.", rules: ["R11", "R12"] });
      add({ id: "autopay", title: "Check AutoPay", body: "If AutoPay was just set up, the bank may still be approving it.", rules: ["R13"] });
    }
    if (intent === "market_or_returns_worry" || intent === "fund_advice" || intent === "other_question") {
      add(safeSkips > 0
        ? { id: "skip", title: "Take a short break instead", body: `Skip up to ${safeSkips} instalment${safeSkips === 1 ? "" : "s"} without cancelling; the SIP stays active.`, rules: ["R1", "R2"] }
        : { id: "skip", title: "Pay the next one, then take a short break", body: "Two are already missed in a row, so a skip now would cancel the SIP. Paying the next instalment resets the count; after that, up to 2 can be skipped.", rules: ["R2", "R1"] });
      add({ id: "lower", title: "Lower the amount", body: "Invest a smaller amount for now. The minimum depends on the fund.", rules: ["R8"] });
    }

    // The person's own choice is always offered, plainly, never hidden (no dark patterns).
    const wantsCancel = action === "cancel" || intent === "stop_permanently";
    if (wantsCancel || intent === "market_or_returns_worry" || intent === "fund_advice")
      add({ id: "cancel", primary: intent === "stop_permanently", title: "Cancel the SIP",
        body: (cancelBlocked ? `The next instalment is due ${dueIn}, so it must be paid before you can cancel. ` : "") +
              "Future instalments stop; money already invested stays invested until you redeem it. A cancel can't be undone, but you can start a new SIP later.",
        rules: cancelBlocked ? ["R5", "R4", "R6", "R7"] : ["R4", "R6", "R7"], blocked: cancelBlocked });
    if (action === "skip" && !options.some(o => o.id === "skip" || o.id === "skip_partial"))
      add({ id: "skip", title: "Skip the next instalment", body: "Request one skip at a time.", rules: ["R1", "R2"] });
    if (action === "change" && !options.some(o => o.id === "date" || o.id === "amount"))
      add({ id: "date", title: "Change the date or amount", body: "Update it from the SIP's settings.", rules: ["R8"] });
    add({ id: "keep", title: "Keep the SIP as it is", body: "Nothing changes.", rules: [] });

    // de-duplicate by id, keep first
    const seen = new Set();
    return { state: st, nextDue: fmtDate(next), safeSkips, notes, options: options.filter(o => !seen.has(o.id) && seen.add(o.id)) };
  }

  // ---------- the gate: checks every AI reply before it is shown
  const AMCS = /\b(sbi|hdfc|icici|axis|nippon|parag parikh|ppfas|mirae|kotak|aditya birla|absl|uti|quant|motilal|tata|dsp|franklin|edelweiss|canara robeco|bandhan|invesco|hsbc|baroda|lic mf|navi|groww mutual|zerodha fund)\b/i;
  const ADVICE = [
    /\b(best|top|good|better|great|safer|recommend\w*|suggest\w*|prefer)\b[^.!?\n]{0,40}\b(funds?|stocks?|schemes?|shares?|etfs?|small ?cap|mid ?cap|large ?cap|index|fd|fixed deposit|gold|crypto)\b/i,
    /\b(switch|move|shift|put|invest)\b[^.!?\n]{0,25}\b(into|in|to)\b[^.!?\n]{0,25}\b(funds?|stocks?|schemes?|fd|fixed deposit|gold|crypto|index)\b/i,
    /\b(you should|aapko|tumhe)\b[^.!?\n]{0,30}\b(invest|buy|sell|redeem|continue investing|keep investing)\b/i,
    /\b(will|surely|guaranteed|definitely|zaroor)\b[^.!?\n]{0,25}\b(recover|grow|rise|go up|bounce|return|double|badhega)\b/i,
  ];
  const CLAIM = /\b(you can|you can'?t|you cannot|you could|you may|you'?re allowed to|it'?s possible to)\s+(\w+\s+){0,3}?(skip|pause|stop|cancel|resume|restart|change|adjust|reduce|lower|increase|take a (short )?break|hold)\b[^.!?\n]{0,40}|\b(skip|pause|cancel|stop|band|ruk|change|reduce|lower|resume)\w*\b[^.!?\n]{0,30}\b(kar sakte|kar sakti|kar sakta|kar payenge|ho sakta|can be done|is possible)\b|(रोक|बंद|स्किप|कैंसल|रद्द|बदल|कम)[^।.!?]{0,20}(सकते|सकती|सकता)/i;
  const FEAR = /\b(miss(ing)? out|fomo|hurry|act now|right now before|last chance|don'?t miss|before it'?s too late|lose everything|you('ll| will) lose|you('ll| will) regret|regret it|panic|limited time|only today|urgent(ly)?|jaldi karo|mauka mat|pachtaoge|sab doob|nuksaan ho jayega|wealth will be destroyed)\b/i;

  function gate(ai, ctx) {
    const checks = [];
    const add = (id, label, pass, detail) => checks.push({ id, label, pass, detail: detail || "" });
    const ok = ai && typeof ai === "object";
    const intentOk = ok && INTENTS.includes(ai.intent);
    const monthsOk = ok && (ai.months_needed === null || ai.months_needed === undefined || (Number.isInteger(ai.months_needed) && ai.months_needed >= 1 && ai.months_needed <= 24));
    const msg = ok && typeof ai.message === "string" ? ai.message.trim() : "";
    add("schema", "Reply is in the expected format", intentOk && monthsOk && msg.length > 0 && msg.length <= 700,
        !intentOk ? `unknown intent ${JSON.stringify(ai?.intent)}` : !monthsOk ? "months out of range" : !msg ? "empty message" : msg.length > 700 ? "message too long" : "");

<user>

/* ---------- AI: server first, safe local fallback */
async function checkLive() {
  try { const r = await fetch(API, { cache: "no-store" }); const j = await r.json(); S.live = !!j.ok; } catch { S.live = false; }
}
function localRead(text, why) {
  const raw = String(text || ""), { text: clean, removed } = B.redact(raw.slice(0, 1000));
  const t = clean.trim(), lang = B.detectLang(t);
  const base = { lang, removedPII: removed, truncated: raw.length > 1000, gate: { passed: true, checks: [] } };
  if (t.length < 3) return { ...base, mode: "no_text", intent: "unclear", months: null, message: B.NO_TEXT[lang] };
  const intent = B.basicIntent(t, S.action);
  return { ...base, mode: "basic", aiError: why, intent, months: B.basicMonths(t), message: intent === "fund_advice" ? B.DECLINE[lang] : B.FALLBACK[lang] };
}
async function respond(text) {
  if (S.noAI) return localRead(text, "simulated");
  if (String(text).trim().length < 3) return localRead(text, "no_text");
  if (S.live === null) await checkLive();
  if (!S.live) return localRead(text, "no_ai");
  const ctrl = new AbortController(); S.ctrl = ctrl;
  const timer = setTimeout(() => ctrl.abort("timeout"), 25000);
  try {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, signal: ctrl.signal,
      body: JSON.stringify({ text, action: S.action, state: S.state }) });
    if (r.status === 429) return localRead(text, "rate_limited");
    if (!r.ok) return localRead(text, "upstream_error");
    const j = await r.json();
    if (!j || !j.mode || !B.INTENTS.includes(j.intent) || typeof j.message !== "string") return localRead(text, "invalid_response");
    return j;
  } catch (e) {
    if (ctrl.signal.aborted && ctrl.signal.reason !== "timeout") throw new Error("stopped");
    return localRead(text, ctrl.signal.aborted ? "timeout" : "network");
  } finally { clearTimeout(timer); if (S.ctrl === ctrl) S.ctrl = null; }
}

function visibleOptions(p) {
  let opts = p.options.filter(o => o.id !== "keep");

    opts = opts.filter(o => o.id !== "cancel_restart");          // near-duplicates: keep the plain one
  if (opts.length > 3) {
    const must = new Set();
    const prim = opts.find(o => o.primary && !o.blocked); if (prim) must.add(prim.id);
    const mine = opts.find(o => o.id === S.action); if (mine) must.add(mine.id);   // never drop what they tapped
    const keep = opts.filter(o => must.has(o.id));
    for (const o of opts) { if (keep.length >= 3) break; if (!must.has(o.id)) keep.push(o); }
    opts = opts.filter(o => keep.includes(o));                   // keep the original order

    <div class="ctl"><span class="l" id="consL">Skipped or missed in a row already</span><div class="seg" role="group" aria-labelledby="consL">${[0, 1, 2].map(n => `<button type="button" data-cons="${n}" aria-pressed="${st.consecutive === n}">${n}</button>`).join("")}</div></div>
    <div class="ctl"><label for="days">Next instalment: <span id="daysV">${dl}</span></label><input type="range" id="days" min="0" max="31" value="${st.daysToNext}"></div>
    <div class="ctl"><label for="amt">Monthly amount (₹)</label><input type="number" id="amt" min="100" max="10000000" step="100" value="${st.amount}" inputmode="numeric"></div>
    <label class="toggle"><input type="checkbox" id="noai" ${S.noAI ? "checked" : ""}> Simulate AI unavailable</label>
    <p class="small" style="margin:0">Live AI: ${S.live === null ? "checking…" : S.live ? "on" : "off (rule-based mode)"}</p>
    <button class="btn outline" type="button" id="reset">Reset demo</button>
  </div>`;
}
function aboutSheet() {
  return `<div class="grab"></div><div class="sheet-h"><h3 id="sheetTitle">About this prototype</h3><button class="iconbtn" type="button" data-close aria-label="Close">${I.close}</button></div>
  <div class="sheet-b">
    <p style="margin:0"><b>Take a break, don't break up.</b> When a first-time investor taps Skip, Edit or Cancel, the assistant asks what's going on and shows options that keep the SIP alive, each backed by a Groww Help Centre rule.</p>
    <ul style="margin:0;padding-left:18px;display:grid;gap:8px">
      <li>The AI reads intent, break length, language and hardship, and writes a short reply.</li>
      <li>A safety check blocks advice, fear or urgency, numbers, made-up rules and wrong-language replies. A failed reply is swapped for a standard one.</li>
      <li>If the AI is down, a rule-based reading takes over. Options and your original action are always shown.</li>
      <li>Tested on 32 golden cases, 12 held-out phrasings and 62 safety unit tests.</li>
    </ul>
    <p class="small" style="margin:0">Case-study prototype, not affiliated with Groww. Not investment advice. Nothing here changes a real account.</p>
    <a class="btn outline" style="text-decoration:none" href="/lab">Open the test lab and eval results</a>
  </div>`;
}

/* ---------- render + events */
function render() {
  const sc = $("#screen");
  sc.innerHTML = S.view === "sips" ? sipsView() : S.view === "detail" ? detailView() : S.view === "result" ? resultView() : doneView();
  bindScrollFade();
  fitFooter();
  renderSheet();
}
/* footer labels must never wrap: fall back to the short label when the full one would overflow */
function fitFooter() {
  document.querySelectorAll(".actionbar .btn[data-full]").forEach(b => {
    b.textContent = b.dataset.full;
    if (b.scrollWidth > b.clientWidth + 1) b.textContent = b.dataset.short;
  });
}
/* soft fade at the foot of the scroller, only while there is more below */
function bindScrollFade() {
  const el = $("#resultScroll"), fade = $("#scrollFade");
  if (!el || !fade) return;
  const upd = () => fade.classList.toggle("show", el.scrollTop + el.clientHeight < el.scrollHeight - 4);
  el.onscroll = upd;
  requestAnimationFrame(upd);
}
let lastFocus = null;
function renderSheet() {
  const sh = $("#sheet"), scrim = $("#scrim");
  if (!S.sheet) { sh.classList.remove("show"); scrim.classList.remove("show"); setTimeout(() => { if (!S.sheet) { sh.hidden = true; scrim.hidden = true; } }, 220); return; }
  const wasHidden = sh.hidden;
  sh.innerHTML = { ask: askSheet, checks: checksSheet, demo: demoSheet, about: aboutSheet }[S.sheet]();
  sh.hidden = false; scrim.hidden = false;
  if (wasHidden) { lastFocus = document.activeElement; requestAnimationFrame(() => { sh.classList.add("show"); scrim.classList.add("show"); }); }
  bindSheet();
}
function openSheet(name) { S.sheet = name; renderSheet(); setTimeout(() => (name === "ask" ? $("#msg") : $("#sheet [data-close]"))?.focus(), 60); }
function closeSheet() { if (S.busy) stop(); S.sheet = null; renderSheet(); lastFocus?.focus?.(); }
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove("show"), 2600); }

document.addEventListener("click", e => {
  const t = e.target.closest("button, [data-go]"); if (!t) return;
  if (t.id === "scrim") return;
  if (t.dataset.go) { S.view = t.dataset.go === "result" && !S.result ? "detail" : t.dataset.go; S.sheet = null; render(); return; }
  if (t.dataset.sheet) { openSheet(t.dataset.sheet); return; }
  if (t.dataset.act) { S.action = t.dataset.act; S.result = null; S.months = null; if (!S.text || S.lastAct !== S.action) S.text = ""; S.lastAct = S.action; openSheet("ask"); return; }
  if (t.dataset.ics) { downloadICS(t.dataset.ics); return; }
  if (t.dataset.months) { S.months = +t.dataset.months; keepScroll(render); return; }
  if (t.dataset.rule) { const k = t.dataset.key, id = t.dataset.rule; S.openRule = S.openRule && S.openRule.key === k && S.openRule.id === id ? null : { key: k, id }; keepScroll(render); return; }
  if (t.dataset.choose) { const o = currentPlan().options.find(x => x.id === t.dataset.choose); if (!o || o.blocked) return; S.done = { id: o.id, title: o.title, reminder: o.reminder, nextSkip: o.nextSkipReminder, firstSkip: o.firstSkipDate }; S.view = "done"; render(); return; }
  if (t.id === "keep") { S.done = { id: "keep", title: "Your SIP stays as it is" }; S.view = "done"; render(); return; }
  if (t.id === "orig") { S.done = { id: "orig", title: `Continuing to ${lower1(ACTIONS[S.action])}` }; S.view = "done"; render(); return; }
  if (t.id === "aboutBtn") { openSheet("about"); return; }
});
$("#scrim").onclick = closeSheet;
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.sheet) closeSheet(); });
function keepScroll(fn) { const el = $("#resultScroll"), y = el ? el.scrollTop : 0; fn(); const n = $("#resultScroll"); if (n) n.scrollTop = y; }

function bindSheet() {
  const sh = $("#sheet");
  sh.querySelectorAll("[data-close]").forEach(b => b.onclick = closeSheet);
  const msg = $("#msg");
  if (msg) {
    msg.oninput = () => { S.text = msg.value; const c = $("#counter"), n = msg.value.length; c.textContent = `${n}/1000${n > 1000 ? " · extra text will be cut" : ""}`; c.classList.toggle("over", n > 1000); };
    msg.onkeydown = e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); } };
  }
  sh.querySelectorAll("[data-quick]").forEach(b => b.onclick = () => {
    if (b.dataset.quick === JUMP_CHIP) {   // no assistant needed: this is just an Edit SIP job
      if (S.busy) stop();
      S.sheet = null; S.view = "done";
      S.done = { id: "amount", copy: { title: "Opening Edit SIP", text: "You'd now set a new monthly amount. You can change it again later." } };
      render(); return;
    }
    S.text = qToggle(S.text, b.dataset.quick); renderSheet();
    const m = $("#msg"); if (m) { m.focus(); m.setSelectionRange(m.value.length, m.value.length); }
  });
  const s1 = $("#send"); if (s1) s1.onclick = send;
  const s2 = $("#stop"); if (s2) s2.onclick = stop;
  const nr = $("#noReason"); if (nr) nr.onclick = () => { S.text = ""; send(); };
  sh.querySelectorAll("[data-case]").forEach(b => b.onclick = () => {
    if (S.busy) stop();
    const c = CASES[+b.dataset.case];
    S.state = { ...DEFAULT_STATE, amount: S.state.amount, ...c.s }; S.action = c.a; S.lastAct = c.a; S.text = c.t; S.result = null; S.months = null; S.view = "detail";
    render(); openSheet("ask"); send();
  });
  sh.querySelectorAll("[data-cons]").forEach(b => b.onclick = () => { S.state.consecutive = +b.dataset.cons; renderAll(); });
  const days = $("#days"); if (days) days.oninput = () => { S.state.daysToNext = +days.value; $("#daysV").textContent = S.state.daysToNext === 0 ? "today" : plural(S.state.daysToNext, "day"); S.state = B.normState(S.state); keepScroll(() => { $("#screen").innerHTML = ({ sips: sipsView, detail: detailView, result: resultView, done: doneView })[S.view](); }); };
  const amt = $("#amt"); if (amt) amt.onchange = () => { S.state.amount = +amt.value; S.state = B.normState(S.state); renderAll(); };
  const na = $("#noai"); if (na) na.onchange = () => { S.noAI = na.checked; toast(S.noAI ? "AI off: the rule-based reading will be used" : "AI on"); renderSheet(); };
  const rs = $("#reset"); if (rs) rs.onclick = () => { if (S.busy) stop(); Object.assign(S, { view: "sips", sheet: null, action: null, text: "", state: { ...DEFAULT_STATE }, noAI: false, result: null, months: null, openRule: null }); render(); toast("Demo reset"); };
}
function renderAll() { S.state = B.normState(S.state); const keep = S.sheet; keepScroll(render); if (keep) { S.sheet = keep; } }

let reqId = 0;
async function send() {
  if (S.busy) return;
  const my = ++reqId;
  S.busy = true; S.months = null; S.openRule = null; renderSheet();
  let r = null;
  try { r = await respond(S.text); } catch { /* stopped: keep the sheet and the typed text */ }
  if (my !== reqId) return;
  S.busy = false;
  if (r) { S.result = r; S.view = "result"; S.sheet = null; render(); const el = $("#resultScroll"); if (el) el.scrollTop = 0; }
  else renderSheet();
}
function stop() { reqId++; if (S.ctrl) S.ctrl.abort("user"); S.busy = false; if (S.sheet === "ask") renderSheet(); }

function downloadICS(dateText) {
  const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], [dd, mm, yy] = String(dateText).split(" ");
  const d = new Date(+yy, MON.indexOf(mm), +dd); if (isNaN(d) || MON.indexOf(mm) < 0) return;
  const ymd = d.getFullYear() + String(d.getMonth() + 1).padStart(2, "0") + String(d.getDate()).padStart(2, "0");
  const ics = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//SIP Break Assistant prototype//EN", "BEGIN:VEVENT", `UID:${Date.now()}@break-assistant`,
    `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, "").slice(0, 15)}Z`, `DTSTART;VALUE=DATE:${ymd}`, "SUMMARY:SIP restarts soon",
    "DESCRIPTION:Your SIP break ends soon. Check your balance before the next instalment.", "END:VEVENT", "END:VCALENDAR"].join("\r\n");
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([ics], { type: "text/calendar" })); a.download = "sip-reminder.ics"; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast("Reminder downloaded for " + dateText);
}

/* a window shorter than the phone scales the whole device instead of clipping it */
function fitPhone() {
  const box = document.querySelector(".phonebox");
  if (!box) return;
  if (window.matchMedia("(max-width: 500px)").matches) { document.documentElement.style.removeProperty("--k"); return; }
  const k = Math.max(0.5, Math.min(1, (window.innerHeight - 104) / 876));
  document.documentElement.style.setProperty("--k", k.toFixed(4));
}
addEventListener("resize", () => { fitPhone(); fitFooter(); });
fitPhone();
function tickClock() {
  const el = $("#sbTime");
  if (el) el.textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}
tickClock(); setInterval(tickClock, 20000);
render(); checkLive();
</script>
</body>
